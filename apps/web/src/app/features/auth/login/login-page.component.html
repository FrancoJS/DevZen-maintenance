<main class="login-page" aria-labelledby="login-title">
  <section class="login-card">
    <header class="login-card__header">
      <div class="login-brand" aria-label="DevZen Maintenance">
        <span class="login-brand__mark" aria-hidden="true">⚒</span>
        <span>
          <strong>DEVZEN</strong>
          <small>Maintenance</small>
        </span>
      </div>
      <p class="login-card__eyebrow">Sistema de mantenimiento</p>
      <h1 id="login-title">Iniciar sesión</h1>
      <p>Accede a tu espacio de trabajo para gestionar solicitudes y mantenciones.</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="hasError('email')"
          aria-describedby="email-error"
        />
        @if (hasError('email')) {
          <p id="email-error" class="field-error">El correo electrónico es obligatorio.</p>
        }
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="hasError('password')"
          aria-describedby="password-error"
        />
        @if (hasError('password')) {
          <p id="password-error" class="field-error">La contraseña es obligatoria.</p>
        }
      </div>

      <button type="submit">Iniciar sesión</button>
    </form>
  </section>
</main>
